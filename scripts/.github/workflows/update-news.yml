name: 뉴스 자동 업데이트

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 22:00 UTC = 한국시간 오전 7:00
  workflow_dispatch:        # Actions 탭에서 수동 실행 버튼도 제공

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 뉴스 수집 및 번역
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_news.py

      - name: 변경사항 커밋
        run: |
          git config user.name "news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "뉴스 자동 업데이트 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
            git push
          fi
